name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bootstrap_mar_catalog:
        description: Allow first publication of the Mar feed if it returns HTTP 404
        required: false
        type: boolean
        default: false
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Renew Mar catalog metadata
        env:
          BOOTSTRAP_MAR_CATALOG: ${{ github.event_name == 'workflow_dispatch' && inputs.bootstrap_mar_catalog }}
        run: |
          if [ "$BOOTSTRAP_MAR_CATALOG" = "true" ]; then
            python3 scripts/refresh_catalog.py --bootstrap
          else
            python3 scripts/refresh_catalog.py
          fi
      - name: Test site
        run: python3 -m unittest discover -s tests -v
      - name: Package public files only
        run: python3 scripts/build_site.py _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'
      - id: deployment
        uses: actions/deploy-pages@v4
